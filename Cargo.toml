[package]
name = "vine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0"

[dependencies]
pumpkin-protocol = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "82705d5362681d091bbec928013989d51e7895ec" }
pumpkin-util = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "82705d5362681d091bbec928013989d51e7895ec" }
pumpkin-auth = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "82705d5362681d091bbec928013989d51e7895ec" }
pumpkin-command = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "82705d5362681d091bbec928013989d51e7895ec" }
pumpkin-plugin-runtime = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "82705d5362681d091bbec928013989d51e7895ec" }
wasmtime = { version = "50.0.1", default-features = false, features = ["runtime", "component-model", "component-model-async", "async", "cache", "cranelift", "gc", "gc-drc", "threads", "std"] }
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p2", "p3"] }

tokio = { version = "1.54", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = { version = "1.2", features = ["parse", "display", "serde"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = { version = "2.0" }
bytes = { version = "1.12" }
uuid = { version = "1.29", features = ["serde", "v3", "v4"] }
rand = { version = "0.10" }

# Networking & Sockets
socket2 = { version = "0.6", features = ["all"] }

# Security & Cryptography
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
sha1 = { version = "0.11" }
sha2 = { version = "0.11" }
hmac = { version = "0.13" }
num-bigint = { version = "0.5" }
base64 = { version = "0.23" }
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast"] }
hex = { version = "0.4", default-features = false, features = ["std"] }

# HTTP client for Mojang auth and telemetry
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }

# Telemetry & System Info
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[profile.release]
lto = true
codegen-units = 1
